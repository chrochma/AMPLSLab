<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#0f4c81"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ad1ff"/>
    </marker>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <!-- title -->
  <text x="40" y="70" font-family="Segoe UI, Arial" font-size="40" font-weight="700" fill="#ffffff">AMPLS Private DNS Demo Lab</text>
  <text x="40" y="108" font-family="Segoe UI, Arial" font-size="20" fill="#9ad1ff">Split DNS per VNet · Infoblox · Private Link Scope · firewall reality check</text>

  <!-- subscriptions -->
  <rect x="60" y="160" width="170" height="90" rx="12" fill="#13375f" stroke="#3fb950" stroke-width="2"/>
  <text x="145" y="198" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" fill="#fff">Subscription A</text>
  <text x="145" y="224" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#3fb950">10.0.2.x ✔</text>

  <rect x="60" y="20" width="0" height="0"/>
  <rect x="270" y="160" width="170" height="90" rx="12" fill="#13375f" stroke="#f85149" stroke-width="2"/>
  <text x="355" y="198" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" fill="#fff">Subscription B</text>
  <text x="355" y="224" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#f85149">10.0.2.x ✖ FW</text>

  <!-- DNS -->
  <rect x="540" y="140" width="190" height="60" rx="10" fill="#1f6feb"/>
  <text x="635" y="177" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" fill="#fff">Infoblox (std DNS)</text>
  <rect x="540" y="215" width="190" height="60" rx="10" fill="#8957e5"/>
  <text x="635" y="252" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" fill="#fff">Monitoring DNS</text>

  <line x1="230" y1="190" x2="535" y2="245" stroke="#9ad1ff" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="440" y1="190" x2="535" y2="170" stroke="#9ad1ff" stroke-width="2" marker-end="url(#arr)"/>

  <!-- AMPLS -->
  <circle cx="960" cy="200" r="70" fill="#0b1f3a" stroke="#9ad1ff" stroke-width="3"/>
  <text x="960" y="195" text-anchor="middle" font-family="Segoe UI, Arial" font-size="22" font-weight="700" fill="#fff">AMPLS</text>
  <text x="960" y="222" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#9ad1ff">privatelink.*</text>
  <line x1="730" y1="245" x2="885" y2="215" stroke="#9ad1ff" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="1100" y="120" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#9ad1ff">168.63.129.16</text>
</svg>
